<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sim gym — RANDO</title>
    <link rel="stylesheet" href="./app/style.css" />
    <link rel="stylesheet" href="./app/replay.css" />
    <link rel="stylesheet" href="./app/sim-gym.css" />
  </head>
  <body class="replay-page">
    <main class="replay-main">
      <h1>Sim gym</h1>
      <p id="status" role="status">Loading games…</p>
      <p id="rules" class="helper">
        25-second duels · Hard bots · One move each · No supporting moves or built-in melee. Fewer
        deaths wins; remaining health breaks ties.
      </p>
      <div id="pairs" aria-label="Move pairs"></div>
      <section id="viewer" hidden>
        <h2 id="match-title"></h2>
        <p id="verdict"></p>
        <div class="gym-table-wrap">
          <table>
            <caption>
              Fewer deaths wins · Remaining health breaks ties
            </caption>
            <thead>
              <tr>
                <th>Game</th>
                <th id="a-heading" class="gym-score-a" scope="col"></th>
                <th id="b-heading" class="gym-score-b" scope="col"></th>
                <th>Seed</th>
              </tr>
            </thead>
            <tbody id="games"></tbody>
          </table>
        </div>
        <p id="verification" role="status"></p>
        <canvas id="gym-canvas" aria-label="Simulation replay"></canvas>
        <div class="replay-controls">
          <div class="replay-timeline">
            <label for="seek">Position</label
            ><input id="seek" type="range" min="0" max="750" value="0" step="1" /><output
              id="position"
              >0:00 / 0:25</output
            >
          </div>
          <div class="replay-toolbar">
            <button id="previous" class="button subtle">Previous game</button
            ><button id="play" class="button primary">Play</button
            ><button id="next" class="button subtle">Next game</button
            ><label
              >Speed
              <select id="speed">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
              </select></label
            ><a id="download" class="helper" download>Download replay</a>
          </div>
        </div>
        <p id="live-stats"></p>
        <details>
          <summary>Move definitions</summary>
          <pre id="definitions"></pre>
        </details>
      </section>
    </main>
    <script type="module" src="./app/sim-gym.js"></script>
  </body>
</html>
